<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 192 192" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Payment sent</title>
  <desc id="desc">A coin travels upward, followed by a green confirmation check. The animation plays once.</desc>
  <style>
    .halo { transform-origin: 96px 96px; animation: halo 1.65s ease-out both; }
    .badge { transform-origin: 96px 96px; animation: badge 1.65s both; }
    .check { stroke-dasharray: 1; stroke-dashoffset: 0; animation: check 1.65s ease both; }
    .coin { opacity: 0; transform-origin: 96px 96px; animation: send 1.65s both; }
    .trail { opacity: 0; stroke-dasharray: 1; animation: trail 1.65s ease-out both; }
    .spark { opacity: 0; transform-origin: 96px 96px; animation: spark 1.65s ease-out both; }
    @keyframes send {
      0% { opacity: 0; transform: translate(-38px, 30px) scale(.7) rotate(-16deg); }
      10% { opacity: 1; transform: translate(-34px, 28px) scale(1) rotate(-12deg); }
      28% { opacity: 1; transform: translate(3px, -7px) scale(1) rotate(6deg); }
      43% { opacity: 0; transform: translate(48px, -48px) scale(.6) rotate(20deg); }
      100% { opacity: 0; transform: translate(48px, -48px) scale(.6) rotate(20deg); }
    }
    @keyframes trail {
      0%, 8% { opacity: 0; stroke-dashoffset: 1; }
      17% { opacity: .65; }
      38% { opacity: .65; stroke-dashoffset: 0; }
      52%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @keyframes halo {
      0%, 32% { opacity: 0; transform: scale(.65); }
      62% { opacity: 1; transform: scale(1.06); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes badge {
      0%, 35% { opacity: 0; transform: scale(.55); }
      62% { opacity: 1; transform: scale(1.07); animation-timing-function: ease-out; }
      78%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes check {
      0%, 54% { stroke-dashoffset: 1; }
      79%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes spark {
      0%, 47% { opacity: 0; transform: scale(.72); }
      61% { opacity: 1; }
      86%, 100% { opacity: 0; transform: scale(1.13); }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo, .badge, .check, .coin, .trail, .spark { animation: none; }
    }
  </style>

  <g class="halo">
    <circle cx="96" cy="96" r="70" fill="#EAF8F2"/>
    <circle cx="96" cy="96" r="59" stroke="#CDEBDD"/>
  </g>

  <path class="trail" d="M47 132C70 132 111 88 141 53" pathLength="1" stroke="#55B99A" stroke-width="3" stroke-linecap="round"/>

  <g class="coin">
    <circle cx="96" cy="99" r="21" fill="#C38724"/>
    <circle cx="96" cy="95" r="21" fill="#F5C768"/>
    <circle cx="96" cy="95" r="15.5" stroke="#D49B36" stroke-width="1.5"/>
    <path d="M89 96L96 89L103 96M96 89V103" stroke="#855C1C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M83 85A16 16 0 0 1 93 79" stroke="#FFE8AF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g class="badge">
    <circle cx="96" cy="99" r="43" fill="#D5EDE2"/>
    <circle cx="96" cy="96" r="43" fill="#128365"/>
    <path class="check" d="M77 96L90 109L116 83" pathLength="1" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="spark" stroke="#39A884" stroke-width="2.5" stroke-linecap="round">
    <path d="M145 54L150 49M150 68H157M133 42V36"/>
    <path d="M44 126L39 131M48 144V150"/>
    <circle cx="44" cy="58" r="2" fill="#8CCEB5" stroke="none"/>
    <circle cx="145" cy="137" r="2.5" fill="#8CCEB5" stroke="none"/>
  </g>
</svg>
