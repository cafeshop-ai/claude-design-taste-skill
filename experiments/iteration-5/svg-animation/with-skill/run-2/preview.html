<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}

  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}

  <title id="cu-title">You're all caught up</title>
  <desc id="cu-desc">An envelope with a check mark floats gently, then rests.</desc>
  <style>
    .cu-illustration {
      --cu-backdrop: #edf3ef;
      --cu-ground: #d7e3da;
      --cu-paper: #fbfcfa;
      --cu-flap: #e1ece5;
      --cu-ink: #596b60;
      --cu-accent: #397454;
      --cu-check: #ffffff;
    }
    .cu-backdrop { fill: var(--cu-backdrop); }
    .cu-ground { fill: var(--cu-ground); }
    .cu-envelope { fill: var(--cu-paper); stroke: var(--cu-ink); }
    .cu-flap { fill: var(--cu-flap); stroke: var(--cu-ink); }
    .cu-seams { fill: none; stroke: var(--cu-ink); }
    .cu-seal { fill: var(--cu-accent); }
    .cu-check { fill: none; stroke: var(--cu-check); stroke-width: 2.5; }
    .cu-float {
      transform-box: fill-box;
      transform-origin: center;
      animation: cu-drift 7s ease-in-out infinite;
    }
    /* A small lift and return, followed by a quiet pause. */
    @keyframes cu-drift {
      0%, 15%, 75%, 100% { transform: translateY(0); }
      45% { transform: translateY(-4px); }
    }
    @media (prefers-color-scheme: dark) {
      .cu-illustration {
        --cu-backdrop: #252f2a;
        --cu-ground: #33473a;
        --cu-paper: #303e35;
        --cu-flap: #3b4e41;
        --cu-ink: #afc3b5;
        --cu-accent: #9bc8aa;
        --cu-check: #203c2b;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .cu-illustration * { animation: none !important; }
    }
  </style>

</svg>
</div></div></div></div>
