<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}
  .dark{background:#151515;border-color:#151515;color:#aaa}
  .sizes{display:flex;gap:28px;align-items:end}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;width:220px;padding:8px 12px;border-radius:8px 8px 0 0;background:#f1f1f1;color:#222}
  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}
#art svg{width:100%;height:auto;max-height:240px}</style><div class="sheet"><div class="row">
        <div class="panel" id="stage" style="flex:none;width:420px;height:320px"><div id="art" style="width:240px"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="32" viewBox="0 0 40 32" role="img" aria-labelledby="title desc">
  <title id="title">Buffering audio</title>
  <desc id="desc">Five violet waveform bars pulse while the podcast episode loads.</desc>
  <style>
    .bar {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 60%, 100% { transform: scaleY(.33); opacity: .5; }
      30% { transform: scaleY(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; }
    }
  </style>
  <g fill="#8b5cf6">
    <rect class="bar" x="4" y="10" width="4" height="12" rx="2" style="animation-delay: -.8s"/>
    <rect class="bar" x="11" y="6" width="4" height="20" rx="2" style="animation-delay: -.65s"/>
    <rect class="bar" x="18" y="4" width="4" height="24" rx="2" style="animation-delay: -.5s"/>
    <rect class="bar" x="25" y="6" width="4" height="20" rx="2" style="animation-delay: -.35s"/>
    <rect class="bar" x="32" y="10" width="4" height="12" rx="2" style="animation-delay: -.2s"/>
  </g>
</svg>
</div></div></div></div>
