<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}
  .dark{background:#151515;border-color:#151515;color:#aaa}
  .sizes{display:flex;gap:28px;align-items:end}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;width:220px;padding:8px 12px;border-radius:8px 8px 0 0;background:#f1f1f1;color:#222}
  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}
#art svg{width:100%;height:auto;max-height:240px}</style><div class="sheet"><div class="row">
        <div class="panel" id="stage" style="flex:none;width:420px;height:320px"><div id="art" style="width:240px"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="title" color="#8b5cf6">
  <title id="title">Buffering episode</title>
  <style>
    .bar {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scaleY(.3); opacity: .5; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; }
    }
  </style>
  <g fill="currentColor">
    <rect class="bar" x="10" y="17" width="4" height="14" rx="2" style="animation-delay: -.4s"/>
    <rect class="bar" x="16" y="13" width="4" height="22" rx="2" style="animation-delay: -.2s"/>
    <rect class="bar" x="22" y="10" width="4" height="28" rx="2"/>
    <rect class="bar" x="28" y="13" width="4" height="22" rx="2" style="animation-delay: -.2s"/>
    <rect class="bar" x="34" y="17" width="4" height="14" rx="2" style="animation-delay: -.4s"/>
  </g>
</svg>
</div></div></div></div>
