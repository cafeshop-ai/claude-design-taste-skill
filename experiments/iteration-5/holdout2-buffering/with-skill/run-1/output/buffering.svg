<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32" role="img" aria-labelledby="buffering-title">
  <title id="buffering-title">Buffering episode…</title>
  <style>
    :root { color: #087f8c; }
    .buffering-bar {
      fill: var(--buffering-color, currentColor);
      transform-box: fill-box;
      transform-origin: center;
      animation: buffering-wave 1.2s ease-in-out infinite;
    }
    .buffering-bar:nth-of-type(1) { animation-delay: -0.48s; }
    .buffering-bar:nth-of-type(2) { animation-delay: -0.36s; }
    .buffering-bar:nth-of-type(3) { animation-delay: -0.24s; }
    .buffering-bar:nth-of-type(4) { animation-delay: -0.12s; }
    @keyframes buffering-wave {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    @media (prefers-color-scheme: dark) {
      :root { color: #65d6ce; }
    }
    @media (prefers-reduced-motion: reduce) {
      .buffering-bar { animation: none; }
    }
  </style>
  <g>
    <rect class="buffering-bar" x="8" y="10" width="4" height="12" rx="2"/>
    <rect class="buffering-bar" x="15" y="6" width="4" height="20" rx="2"/>
    <rect class="buffering-bar" x="22" y="4" width="4" height="24" rx="2"/>
    <rect class="buffering-bar" x="29" y="6" width="4" height="20" rx="2"/>
    <rect class="buffering-bar" x="36" y="10" width="4" height="12" rx="2"/>
  </g>
</svg>
