<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}
  .dark{background:#151515;border-color:#151515;color:#aaa}
  .sizes{display:flex;gap:28px;align-items:end}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;width:220px;padding:8px 12px;border-radius:8px 8px 0 0;background:#f1f1f1;color:#222}
  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}
#art svg{width:100%;height:auto;max-height:240px}</style><div class="sheet"><div class="row">
        <div class="panel" id="stage" style="flex:none;width:420px;height:320px"><div id="art" style="width:240px"><svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128" fill="none" role="img" aria-labelledby="caught-up-title caught-up-desc">
  <title id="caught-up-title">You're all caught up</title>
  <desc id="caught-up-desc">An envelope with a checkmark floats gently, then rests.</desc>
  <style>
    svg {
      --mail-fill: #f3f6f5;
      --mail-line: #697b75;
      --check-fill: #e6f1eb;
      --check-line: #357557;
    }
    .mail {
      transform-box: fill-box;
      transform-origin: center;
      animation: drift 7s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 20%, 80%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --mail-fill: #252f2c;
        --mail-line: #a0b3ab;
        --check-fill: #243e30;
        --check-line: #91c9a6;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <g class="mail" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="28" y="32" width="100" height="68" rx="9" fill="var(--mail-fill)" stroke="var(--mail-line)"/>
    <path d="m31 36 41 32a10 10 0 0 0 12 0l41-32M31 96l30-25m34 0 30 25" stroke="var(--mail-line)"/>
    <circle cx="120" cy="96" r="17" fill="var(--check-fill)" stroke="var(--check-line)"/>
    <path d="m112 96 5 5 11-11" stroke="var(--check-line)" stroke-width="3"/>
  </g>
</svg>
</div></div></div></div>
