<svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128" role="img" aria-labelledby="caught-up-title caught-up-desc">
  <title id="caught-up-title">You're all caught up</title>
  <desc id="caught-up-desc">An envelope with a check mark floats gently above a resting line.</desc>
  <style>
    :root {
      --outline: #64756e;
      --paper: #f6f9f7;
      --fold: #e6eee9;
      --accent: #34745a;
      --check: #ffffff;
      --ground: #dbe5df;
    }
    .mail {
      transform-box: fill-box;
      transform-origin: center;
      animation: caught-up-float 7s ease-in-out infinite;
    }
    @keyframes caught-up-float {
      0%, 20%, 80%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --outline: #a7bbb0;
        --paper: #263b31;
        --fold: #324b3e;
        --accent: #9bd4b4;
        --check: #203c2e;
        --ground: #42584c;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <path d="M56 106h48" fill="none" stroke="var(--ground)" stroke-width="2" stroke-linecap="round"/>
  <g class="mail" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="36" width="88" height="58" rx="8" fill="var(--paper)" stroke="var(--outline)" stroke-width="2"/>
    <path d="m36 90 29-24h26l29 24" fill="var(--fold)"/>
    <path d="m36 90 29-24m26 0 29 24" fill="none" stroke="var(--outline)" stroke-width="2"/>
    <path d="m36 40 36 28a10 10 0 0 0 12 0l36-28" fill="var(--paper)" stroke="var(--outline)" stroke-width="2"/>
    <circle cx="116" cy="87" r="17" fill="var(--accent)" stroke="var(--paper)" stroke-width="4"/>
    <path d="m109 87 5 5 9-10" fill="none" stroke="var(--check)" stroke-width="2.5"/>
  </g>
</svg>
