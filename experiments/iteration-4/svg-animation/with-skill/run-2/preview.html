<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}
  .dark{background:#151515;border-color:#151515;color:#aaa}
  .sizes{display:flex;gap:28px;align-items:end}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;width:220px;padding:8px 12px;border-radius:8px 8px 0 0;background:#f1f1f1;color:#222}
  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}
#art svg{width:100%;height:auto;max-height:240px}</style><div class="sheet"><div class="row">
        <div class="panel" id="stage" style="flex:none;width:420px;height:320px"><div id="art" style="width:240px"><svg xmlns="http://www.w3.org/2000/svg" width="160" height="144" viewBox="0 0 160 144" role="img" aria-labelledby="caught-up-title" class="caught-up">
  <title id="caught-up-title">You're all caught up</title>
  <style>
    .caught-up {
      --mail-fill: #edf5f0;
      --mail-stroke: #607268;
      --check-fill: #277553;
      --check-stroke: #ffffff;
      --badge-edge: #ffffff;
    }
    .caught-up-envelope {
      transform-box: fill-box;
      transform-origin: center;
      animation: caught-up-float 8s ease-in-out infinite;
    }
    @keyframes caught-up-float {
      0%, 25%, 75%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @media (prefers-color-scheme: dark) {
      .caught-up {
        --mail-fill: #253a30;
        --mail-stroke: #a1b8aa;
        --check-fill: #89caa5;
        --check-stroke: #173b29;
        --badge-edge: #1c2922;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .caught-up * { animation: none !important; }
    }
  </style>
  <g class="caught-up-envelope" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="32" y="44" width="88" height="64" rx="8" fill="var(--mail-fill)" stroke="var(--mail-stroke)"/>
    <path d="m35 49 36 27a8 8 0 0 0 10 0l36-27" fill="none" stroke="var(--mail-stroke)"/>
    <circle cx="116" cy="104" r="16" fill="var(--check-fill)" stroke="var(--badge-edge)" stroke-width="4"/>
    <path d="m109 104 5 5 9-10" fill="none" stroke="var(--check-stroke)" stroke-width="2.5"/>
  </g>
</svg>
</div></div></div></div>
