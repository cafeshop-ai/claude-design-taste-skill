<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}
  .dark{background:#151515;border-color:#151515;color:#aaa}
  .sizes{display:flex;gap:28px;align-items:end}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;width:220px;padding:8px 12px;border-radius:8px 8px 0 0;background:#f1f1f1;color:#222}
  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}
#art svg{width:100%;height:auto;max-height:240px}</style><div class="sheet"><div class="row">
        <div class="panel" id="stage" style="flex:none;width:420px;height:320px"><div id="art" style="width:240px"><svg xmlns="http://www.w3.org/2000/svg" width="160" height="128" viewBox="0 0 160 128" role="img" aria-labelledby="caught-up-title">
  <title id="caught-up-title">You're all caught up</title>
  <style>
    :root {
      --envelope-fill: #f1f5f9;
      --envelope-stroke: #64748b;
      --check-fill: #e8f2fc;
      --check-stroke: #3674ad;
    }
    .mail {
      transform-box: fill-box;
      transform-origin: center;
      animation: caught-up-float 7s ease-in-out infinite;
    }
    @keyframes caught-up-float {
      0%, 35%, 100% { transform: translateY(0); }
      67.5% { transform: translateY(-4px); }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --envelope-fill: #202d3d;
        --envelope-stroke: #a3b3c6;
        --check-fill: #203b54;
        --check-stroke: #9acbfa;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <g class="mail" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="38" width="88" height="56" rx="8" fill="var(--envelope-fill)" stroke="var(--envelope-stroke)"/>
    <path d="m37 42 35 26a10 10 0 0 0 12 0l35-26" fill="none" stroke="var(--envelope-stroke)"/>
    <circle cx="114" cy="86" r="17" fill="var(--check-fill)" stroke="var(--check-stroke)"/>
    <path d="m106 86 5 5 11-11" fill="none" stroke="var(--check-stroke)" stroke-width="2.5"/>
  </g>
</svg>
</div></div></div></div>
