<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}
  .dark{background:#151515;border-color:#151515;color:#aaa}
  .sizes{display:flex;gap:28px;align-items:end}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;width:220px;padding:8px 12px;border-radius:8px 8px 0 0;background:#f1f1f1;color:#222}
  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}
#art svg{width:100%;height:auto;max-height:240px}</style><div class="sheet"><div class="row">
        <div class="panel" id="stage" style="flex:none;width:420px;height:320px"><div id="art" style="width:240px"><svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">You're all caught up</title>
  <desc id="desc">A floating lavender envelope with a mint green checkmark. All your email is taken care of.</desc>
  <style>
    .envelope { animation: drift 6s ease-in-out infinite; }
    .shadow { transform-origin: 120px 164px; animation: breathe 6s ease-in-out infinite; }
    .halo { animation: glow 6s ease-in-out infinite; }
    .spark { animation: twinkle 6s ease-in-out infinite; }
    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes breathe {
      0%, 100% { transform: scaleX(1); opacity: .55; }
      50% { transform: scaleX(.9); opacity: .35; }
    }
    @keyframes glow {
      0%, 100% { opacity: .5; }
      50% { opacity: .85; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: .45; }
      50% { opacity: .8; }
    }
    @media (prefers-reduced-motion: reduce) {
      .envelope, .shadow, .halo, .spark { animation: none; }
    }
  </style>

  <circle cx="120" cy="99" r="70" fill="#F6F5FB"/>
  <ellipse class="shadow" cx="120" cy="164" rx="43" ry="5" fill="#DAD7EA" opacity=".55"/>

  <circle cx="184" cy="45" r="2.5" fill="#B9D8CD"/>

    <path d="m61 92 53 36a11 11 0 0 0 12 0l53-36v47a9 9 0 0 1-9 9H70a9 9 0 0 1-9-9Z" fill="#EEEAF8"/>

</svg>
