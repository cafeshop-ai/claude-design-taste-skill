<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}
  .dark{background:#151515;border-color:#151515;color:#aaa}
  .sizes{display:flex;gap:28px;align-items:end}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;width:220px;padding:8px 12px;border-radius:8px 8px 0 0;background:#f1f1f1;color:#222}
  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}
#art svg{width:100%;height:auto;max-height:240px}</style><div class="sheet"><div class="row">
        <div class="panel" id="stage" style="flex:none;width:420px;height:320px"><div id="art" style="width:240px"><svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 96 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Loading forecast</title>
  <desc id="desc">A turning sun peeks behind a gently floating cloud with falling rain.</desc>
  <style>
    .sun { transform-origin: 35px 33px; animation: turn 16s linear infinite; }
    .cloud { animation: float 2.8s ease-in-out infinite; }
    .rain { animation: fall 1.5s ease-in infinite; opacity: 0; }
    .rain-two { animation-delay: .5s; }
    .rain-three { animation-delay: 1s; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes float { 50% { transform: translateY(-3px); } }
    @keyframes fall {
      0% { opacity: 0; transform: translateY(-3px); }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { opacity: 0; transform: translateY(7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sun, .cloud, .rain { animation: none; }
      .rain { opacity: .7; }
    }
  </style>
  <g class="sun">
    <circle cx="35" cy="33" r="12" fill="#FBBF4A"/>
    <path d="M35 12V8M35 58V54M14 33H10M60 33H56M20 18L17 15M53 51L50 48M20 48L17 51M53 15L50 18" stroke="#FBBF4A" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g class="cloud">
    <path d="M30 67C22 67 17 62 17 55C17 48 22 43 29 43C31 35 37 30 45 30C55 30 62 37 63 46C65 45 67 45 69 45C77 45 83 50 83 57C83 63 78 67 71 67H30Z" fill="#F1F7FF" stroke="#718BA5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M34 40C37 36 41 35 45 35" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g stroke="#64ADE5" stroke-width="3.5" stroke-linecap="round">
    <path class="rain" d="M35 75L33 80"/>
    <path class="rain rain-two" d="M50 75L48 80"/>
    <path class="rain rain-three" d="M65 75L63 80"/>
  </g>
</svg>
</div></div></div></div>
