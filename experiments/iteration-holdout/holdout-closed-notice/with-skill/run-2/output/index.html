<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f3e9">
  <meta name="description" content="Crumb & Co. is closed for renovations July 1–21, 2027, reopening July 22. Place catering orders by phone at 503-555-0142.">
  <title>Renovation notice · Crumb &amp; Co.</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f3e9;
      --ink: #382d27;
      --muted: #6c5c50;
      --accent: #963e2e;
      --accent-hover: #753023;
      --rule: #d9cabc;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 48px;
      --space-6: 64px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 18px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .notice {
      width: min(100%, 816px);
      min-height: 100svh;
      margin-inline: auto;
      padding: var(--space-5) var(--space-4);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .masthead {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      color: var(--accent);
      font: 700 32px/1.2 var(--serif);
      letter-spacing: -1px;
    }
    .masthead::before, .masthead::after {
      content: '';
      height: 1px;
      background: var(--rule);
      flex: 1;
    }
    .brand { white-space: nowrap; }
    .bread {
      display: block;
      width: 176px;
      height: 112px;
      margin: var(--space-5) auto var(--space-3);
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font: 400 clamp(48px, 7vw, 80px)/1.04 var(--serif);
      letter-spacing: -0.045em;
      text-wrap: balance;
    }
    .dates {
      margin: var(--space-4) 0 var(--space-1);
      color: var(--accent);
      font: 400 clamp(24px, 4vw, 32px)/1.3 var(--serif);
      font-variant-numeric: lining-nums;
    }
    .reopening { margin: 0; color: var(--muted); }
    .reopening strong { color: var(--ink); font-weight: 600; }
    .catering {
      width: min(100%, 416px);
      margin: var(--space-5) auto 0;
      padding-top: var(--space-4);
      border-top: 1px solid var(--rule);
    }
    .catering p { margin: 0 0 var(--space-2); font-size: 16px; }
    .phone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 48px;
      padding: 12px var(--space-3);
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: var(--paper);
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: background-color 150ms ease-out, border-color 150ms ease-out;
    }
    .phone svg { width: 18px; height: 18px; flex-shrink: 0; }
    .phone:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .phone:active { background: var(--ink); border-color: var(--ink); }
    .phone:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    @media (max-width: 480px) {
      .notice { padding: var(--space-4) var(--space-3); }
      .masthead { font-size: 28px; gap: var(--space-2); }
      .bread { margin-top: var(--space-4); }
      .catering { margin-top: var(--space-4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .phone { transition: none; }
    }
  </style>
</head>
<body>
  <main class="notice">
    <header class="masthead"><span class="brand">Crumb &amp; Co.</span></header>

    <svg class="bread" viewBox="0 0 176 112" fill="none" aria-hidden="true">
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 77C21 58 36 37 64 31C88 25 119 30 139 45C151 54 157 69 151 80C141 97 39 99 26 83Z"/>
        <path d="M25 78C52 87 124 88 153 76M30 84C56 92 126 92 146 83"/>
        <path d="M52 40C42 49 41 59 47 66C48 56 54 48 62 43M78 34C67 42 64 54 70 62C73 51 79 44 87 39M106 37C95 43 91 53 96 63C100 53 105 47 115 44M132 48C122 51 117 60 120 68C124 60 130 57 138 56"/>
        <path d="M69 18C65 13 72 10 69 5M90 15C86 10 93 7 90 2M111 20C107 15 114 12 111 7"/>
      </g>
      <g fill="currentColor">
        <ellipse cx="16" cy="91" rx="2.5" ry="1.5" transform="rotate(-25 16 91)"/>
        <ellipse cx="160" cy="91" rx="2" ry="1.5" transform="rotate(25 160 91)"/>
        <circle cx="153" cy="100" r="1.5"/>
        <circle cx="28" cy="101" r="1.5"/>
      </g>
    </svg>

    <h1>Closed for<br>renovations.</h1>
    <p class="dates"><time datetime="2027-07-01">July 1</time>–<time datetime="2027-07-21">21, 2027</time></p>
    <p class="reopening">We reopen on <strong><time datetime="2027-07-22">July 22, 2027.</time></strong></p>

    <div class="catering">
      <p>Catering orders can still be placed by phone.</p>
      <a class="phone" href="tel:+15035550142">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 3 3 5-3 2c1.5 3.1 3.9 5.5 7 7l2-3 5 3c0 3-2 4-4 4C9 20 4 15 3 7c0-2 1-4 4-4Z"/></svg>
        Call 503-555-0142
      </a>
    </div>
  </main>
</body>
</html>
