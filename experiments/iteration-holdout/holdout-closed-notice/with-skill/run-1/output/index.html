<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e8">
  <meta name="description" content="Crumb & Co. is closed for renovations July 1–21, 2027, reopening July 22. Catering orders are still available by phone at 503-555-0142.">
  <title>Renovation notice · Crumb &amp; Co.</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f2e8;
      --ink: #493529;
      --muted: #756153;
      --accent: #91462f;
      --accent-hover: #753522;
      --rule: #d6c9b7;
      --tint: #ede2ce;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 48px;
      --space-6: 64px;
      --text-small: .8125rem;
      --text-body: 1rem;
      --text-date: clamp(1.5rem, 4vw, 1.875rem);
      --text-title: clamp(3.25rem, 8vw, 5rem);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .notice {
      width: min(100% - 48px, 680px);
      margin-inline: auto;
      padding-block: var(--space-5);
      text-align: center;
    }
    .brand {
      margin: 0;
      font: 700 2rem/1.2 var(--serif);
      letter-spacing: -.06em;
    }
    .brand span { font-style: italic; font-weight: 400; }
    .top-rule {
      height: 1px;
      margin-top: var(--space-4);
      background: var(--rule);
    }
    .bread {
      display: block;
      width: 160px;
      height: 112px;
      margin: var(--space-5) auto var(--space-3);
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font: 400 var(--text-title)/1.04 var(--serif);
      letter-spacing: -.055em;
      text-wrap: balance;
    }
    .dates {
      margin: var(--space-4) 0 0;
      font: 400 var(--text-date)/1.3 var(--serif);
      font-variant-numeric: lining-nums;
      letter-spacing: -.02em;
    }
    .reopening {
      margin: var(--space-2) 0 0;
      color: var(--muted);
      font-size: var(--text-body);
      line-height: 1.5;
    }
    .reopening strong { color: var(--ink); font-weight: 600; }
    .catering {
      margin-top: var(--space-5);
      padding-top: var(--space-4);
      border-top: 1px solid var(--rule);
    }
    .catering p {
      margin: 0 auto var(--space-3);
      max-width: 32ch;
      color: var(--muted);
      font-size: var(--text-body);
      line-height: 1.6;
      text-wrap: pretty;
    }
    .phone {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: var(--space-2) var(--space-3);
      border: 1px solid transparent;
      border-radius: 4px;
      background: var(--accent);
      color: var(--paper);
      font-size: var(--text-body);
      font-weight: 500;
      text-decoration: none;
      transition: background-color 150ms ease-out;
    }
    .phone svg { width: 18px; height: 18px; flex: none; }
    .phone:hover { background: var(--accent-hover); }
    .phone:active { background: var(--ink); }
    .phone:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
    @media (min-width: 768px) {
      .notice { padding-block: var(--space-6); }
    }
    @media (max-width: 400px) {
      .notice { width: calc(100% - 40px); padding-block: var(--space-4); }
      .bread { margin-top: var(--space-4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .phone { transition: none; }
    }
  </style>
</head>
<body>
  <main class="notice">
    <header>
      <p class="brand">Crumb <span>&amp;</span> Co.</p>
      <div class="top-rule" aria-hidden="true"></div>
    </header>

    <svg class="bread" viewBox="0 0 160 112" fill="none" aria-hidden="true">
      <path d="M22 76C17 65 26 51 40 40C57 27 80 23 103 28C122 32 137 45 140 59C144 76 129 87 105 91C76 97 33 94 22 76Z" fill="var(--tint)"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 72C18 60 30 45 47 35C65 24 86 23 106 29C126 35 140 48 140 62C140 80 115 90 82 91C50 92 25 85 21 72Z"/>
        <path d="M22 73C44 86 110 90 138 65"/>
        <path d="M53 36C45 44 40 54 43 61C45 64 50 61 54 57C59 52 62 44 64 32"/>
        <path d="M80 29C72 36 65 48 67 55C69 59 74 56 79 51C85 44 88 36 89 28"/>
        <path d="M106 32C98 38 91 47 92 53C94 58 99 54 103 50C108 45 111 40 112 35"/>
        <path d="M39 78L42 79M59 83L61 83M104 80L106 79M121 72L123 71"/>
        <path d="M34 23L31 19M119 17L122 13M76 14L77 8"/>
      </g>
    </svg>

    <h1>Closed for<br>renovations.</h1>
    <p class="dates"><time datetime="2027-07-01">July 1</time>–<time datetime="2027-07-21">21, 2027</time></p>
    <p class="reopening">We reopen on <strong><time datetime="2027-07-22">July 22, 2027</time>.</strong></p>

    <div class="catering">
      <p>Catering orders are still available.<br>Give us a call to place yours.</p>
      <a class="phone" href="tel:+15035550142" aria-label="Call 503-555-0142 to place a catering order">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H4.8C3.8 3 3 3.8 3.1 4.8C3.9 13.4 10.6 20.1 19.2 20.9C20.2 21 21 20.2 21 19.2V16L16 14L14.5 16C11.6 14.7 9.3 12.4 8 9.5L10 8L8 3Z"/>
        </svg>
        Call 503-555-0142
      </a>
    </div>
  </main>
</body>
</html>
