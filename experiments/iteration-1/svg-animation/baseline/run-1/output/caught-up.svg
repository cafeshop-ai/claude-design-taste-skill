<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" fill="none" role="img" aria-labelledby="title description">
  <title id="title">You're all caught up</title>
  <desc id="description">A gently floating envelope with a green checkmark. Your inbox is clear.</desc>
  <style>
    .envelope { animation: float 6s ease-in-out infinite; }
    .shadow { transform-origin: 120px 148px; animation: breathe 6s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes breathe {
      0%, 100% { transform: scaleX(1); opacity: .65; }
      50% { transform: scaleX(.9); opacity: .4; }
    }
    @media (prefers-reduced-motion: reduce) {
      .envelope, .shadow { animation: none; }
    }
  </style>

  <circle cx="119" cy="85" r="62" fill="#EFF7F2"/>
  <circle cx="49" cy="79" r="3" fill="#C7DFD1"/>
  <circle cx="184" cy="52" r="2" fill="#C7DFD1"/>
  <path d="M182 78h8m-4-4v8" stroke="#B7D5C5" stroke-width="2" stroke-linecap="round"/>
  <ellipse class="shadow" cx="120" cy="148" rx="48" ry="4" fill="#CFDED5" opacity=".65"/>

  <g class="envelope">
    <g transform="rotate(-5 118 96)">
      <rect x="62" y="59" width="112" height="76" rx="11" fill="#DCEBE2"/>
      <rect x="62" y="56" width="112" height="76" rx="11" fill="#fff" stroke="#719386" stroke-width="2"/>
      <path d="m66 128 36-32m68 32-36-32" stroke="#C4D7CC" stroke-width="2" stroke-linecap="round"/>
      <path d="m65 61 46 36a11 11 0 0 0 14 0l46-36" fill="#F3F8F5"/>
      <path d="m65 61 46 36a11 11 0 0 0 14 0l46-36" stroke="#719386" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="169" cy="119" r="24" fill="#EFF7F2"/>
    <circle cx="169" cy="119" r="20" fill="#43866C"/>
    <path d="m160 119 6 6 12-13" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
