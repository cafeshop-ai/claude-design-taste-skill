<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" fill="none" role="img" aria-labelledby="title description">
  <title id="title">You're all caught up</title>
  <desc id="description">A softly floating envelope with a green checkmark. All your email is taken care of.</desc>
  <style>
    .mail { animation: float 6s ease-in-out infinite; }
    .shadow { transform-origin: 120px 149px; animation: breathe 6s ease-in-out infinite; }
    .spark { animation: shimmer 6s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes breathe {
      0%, 100% { transform: scaleX(1); opacity: .6; }
      50% { transform: scaleX(.9); opacity: .4; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: .45; }
      50% { opacity: .85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mail, .shadow, .spark { animation: none; }
    }
  </style>

  <circle cx="120" cy="88" r="62" fill="#F5F3FC"/>
  <circle cx="50" cy="108" r="3" fill="#DDD7EF"/>
  <circle cx="188" cy="110" r="2" fill="#D5E9E1"/>
  <path class="spark" d="M61 43V53M56 48H66" stroke="#B7A9D9" stroke-width="2" stroke-linecap="round"/>
  <ellipse class="shadow" cx="120" cy="149" rx="43" ry="4" fill="#DDD7EB" opacity=".6"/>

  <g class="mail">
    <rect x="62" y="65" width="116" height="73" rx="12" fill="#E9E3F7"/>
    <rect x="62" y="61" width="116" height="73" rx="12" fill="#FEFDFF" stroke="#B3A2D2" stroke-width="2"/>
    <path d="M65 129L103 96M175 129L137 96" stroke="#D3C8E8" stroke-width="2" stroke-linecap="round"/>
    <path d="M64 67L112.5 102C117 105.2 123 105.2 127.5 102L176 67" fill="#F0EBFA"/>
    <path d="M64 67L112.5 102C117 105.2 123 105.2 127.5 102L176 67" stroke="#B3A2D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="167" cy="65" r="21" fill="#FEFDFF"/>
    <circle cx="167" cy="65" r="17" fill="#E0F2E9" stroke="#75AC92" stroke-width="2"/>
    <path d="M159.5 65L164.5 70L174.5 59.5" stroke="#408365" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
