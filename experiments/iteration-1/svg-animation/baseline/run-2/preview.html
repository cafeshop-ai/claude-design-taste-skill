<!doctype html><meta charset="utf-8"><style>
  body{margin:0;font:13px/1.4 system-ui,sans-serif;color:#555;background:#fff}
  .sheet{display:grid;gap:24px;padding:32px;width:1100px}
  .row{display:flex;gap:24px;align-items:stretch}
  .panel{flex:1;display:grid;place-items:center;gap:12px;padding:40px;border:1px solid #e5e5e5;border-radius:8px;min-height:180px}
  .dark{background:#151515;border-color:#151515;color:#aaa}
  .sizes{display:flex;gap:28px;align-items:end}
  .sizes figure{margin:0;display:grid;justify-items:center;gap:6px}
  .tab{display:flex;align-items:center;gap:8px;width:220px;padding:8px 12px;border-radius:8px 8px 0 0;background:#f1f1f1;color:#222}
  .tab.d{background:#2a2a2a;color:#eee}
  img{display:block}
#art svg{width:100%;height:auto;max-height:240px}</style><div class="sheet"><div class="row">
        <div class="panel" id="stage" style="flex:none;width:420px;height:320px"><div id="art" style="width:240px"><svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" fill="none" role="img" aria-labelledby="title description">
  <title id="title">You're all caught up</title>
  <desc id="description">A softly floating envelope with a green checkmark. All your email is taken care of.</desc>
  <style>
    .mail { animation: float 6s ease-in-out infinite; }
    .shadow { transform-origin: 120px 149px; animation: breathe 6s ease-in-out infinite; }
    .spark { animation: shimmer 6s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes breathe {
      0%, 100% { transform: scaleX(1); opacity: .6; }
      50% { transform: scaleX(.9); opacity: .4; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: .45; }
      50% { opacity: .85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mail, .shadow, .spark { animation: none; }
    }
  </style>

  <circle cx="120" cy="88" r="62" fill="#F5F3FC"/>
  <circle cx="50" cy="108" r="3" fill="#DDD7EF"/>
  <circle cx="188" cy="110" r="2" fill="#D5E9E1"/>
  <path class="spark" d="M61 43V53M56 48H66" stroke="#B7A9D9" stroke-width="2" stroke-linecap="round"/>
  <ellipse class="shadow" cx="120" cy="149" rx="43" ry="4" fill="#DDD7EB" opacity=".6"/>

  <g class="mail">
    <rect x="62" y="65" width="116" height="73" rx="12" fill="#E9E3F7"/>

    <path d="M65 129L103 96M175 129L137 96" stroke="#D3C8E8" stroke-width="2" stroke-linecap="round"/>

    <path d="M64 67L112.5 102C117 105.2 123 105.2 127.5 102L176 67" stroke="#B3A2D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="167" cy="65" r="21" fill="#FEFDFF"/>
    <circle cx="167" cy="65" r="17" fill="#E0F2E9" stroke="#75AC92" stroke-width="2"/>
    <path d="M159.5 65L164.5 70L174.5 59.5" stroke="#408365" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</div></div></div></div>
